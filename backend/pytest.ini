[pytest]
testpaths = tests
# Coverage floor (Task 24 / F-028). Measured 78% on the CI runner; pinned one
# point below so ordinary fluctuation in a new test file does not fail an
# unrelated PR, while a real drop does. Raise, never lower, without a reason.
addopts = --cov=app --cov-report=term-missing --cov-fail-under=77
